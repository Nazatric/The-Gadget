name: android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write          # publishing the release

concurrency:
  group: gadget-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The APK first, on its own job: an APK that exists and can be downloaded is the point.
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018"

      - name: Accept the SDK licences
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Reject the removed watermark
        run: |
          if grep -RIn --exclude-dir=build -e 'Hengrphcs' -e 'hengrphcs' app/src; then
            echo "removed watermark must not appear in source"
            exit 1
          fi

      - name: Assemble the APK
        run: |
          set -o pipefail
          chmod +x gradlew
          if ./gradlew assembleRelease --stacktrace 2>&1 | tee /tmp/build.log; then
            echo "built the release APK"
          elif ./gradlew assembleDebug --stacktrace 2>&1 | tee -a /tmp/build.log; then
            echo "::warning::the release build failed; this run publishes the debug APK instead"
          else
            exit 1
          fi

      - name: Stage the APK for download
        run: |
          mkdir -p dist
          APK=$(ls app/build/outputs/apk/*/*.apk | head -1)
          cp "$APK" "dist/The Gadget Apk.apk"
          echo "staged $APK"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: The Gadget Apk
          path: dist/The Gadget Apk.apk
          if-no-files-found: error

      - name: Publish the newest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Exactly one release, always the newest build, at a stable public link.
          for tag in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          done
          {
            printf 'The Gadget — the newest build of `%s`.\n\n' "${{ github.sha }}"
            printf '**Install:** download `The Gadget Apk.apk` below and open it on the phone.\n'
            printf '(GitHub rewrites spaces in asset names, so the file arrives as `The.Gadget.Apk.apk`.)\n\n'
            printf -- '- built by run %s from `%s`\n' "${{ github.run_id }}" "${{ github.ref_name }}"
            printf -- '- signed with the Android debug key, so it installs on any phone\n'
          } > /tmp/notes.md
          gh release create latest \
            --target "${{ github.sha }}" \
            --title "The Gadget — newest build" \
            --notes-file /tmp/notes.md \
            "dist/The Gadget Apk.apk"

      - name: Report the failure where it can be read
        if: failure()
        run: |
          if [ -f /tmp/build.log ]; then
            tail -40 /tmp/build.log >> "$GITHUB_STEP_SUMMARY"
            TAIL=$(tail -20 /tmp/build.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::the android build failed — $TAIL"
          fi

  # Tests are their own job, so a failing test can never block the APK and never hide behind it.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018"
      - name: Unit tests
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew test --stacktrace 2>&1 | tee /tmp/test.log
      - name: Report a failing test where it can be read
        if: failure()
        run: |
          if [ -f /tmp/test.log ]; then
            tail -30 /tmp/test.log >> "$GITHUB_STEP_SUMMARY"
            TAIL=$(tail -20 /tmp/test.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::unit tests failed — $TAIL"
          fi
