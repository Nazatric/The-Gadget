name: release apk

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gadget-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install exactly the SDK this project compiles against
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018"

      - name: Accept the SDK licences
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Reject the removed watermark
        run: |
          if grep -RIn --exclude-dir=build -e 'Hengrphcs' -e 'hengrphcs' app/src; then
            echo "removed watermark must not appear in source"
            exit 1
          fi

      - name: Build the APK
        run: |
          set -o pipefail
          chmod +x gradlew
          if ./gradlew --no-daemon assembleRelease --stacktrace 2>&1 | tee /tmp/build.log; then
            echo "built the release APK"
          elif ./gradlew --no-daemon assembleDebug --stacktrace 2>&1 | tee -a /tmp/build.log; then
            echo "::warning::release failed; publishing the debug build instead"
          else
            echo "::error::both builds failed — the error is at the end of the run summary"
            exit 1
          fi

      - name: Stage the APK
        run: |
          mkdir -p dist
          APK=$(ls app/build/outputs/apk/*/*.apk | head -1)
          cp "$APK" "dist/The Gadget Apk.apk"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: The Gadget Apk
          path: dist/The Gadget Apk.apk
          if-no-files-found: error

      - name: Publish it as a real download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for tag in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          done
          {
            printf 'The Gadget — newest build of `%s`.\n\n' "${{ github.sha }}"
            printf '**Install:** download `The Gadget Apk.apk` below and open it on the phone.\n'
            printf '(GitHub removes the spaces, so the file arrives as `The.Gadget.Apk.apk`.)\n'
          } > /tmp/notes.md
          gh release create latest --target "${{ github.sha }}" \
            --title "The Gadget — newest build" --notes-file /tmp/notes.md \
            "dist/The Gadget Apk.apk"

      - name: If it failed, show why in the open
        if: failure()
        run: |
          if [ -f /tmp/build.log ]; then
            tail -50 /tmp/build.log >> "$GITHUB_STEP_SUMMARY"
            tail -20 /tmp/build.log | sed ':a;N;$!ba;s/\n/%0A/g' > /tmp/tail.txt
            echo "::error::$(cat /tmp/tail.txt)"
          fi
